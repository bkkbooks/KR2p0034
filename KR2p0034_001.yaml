body:
  text: 凡人雖有性心亡定志待恃物而後作待恃悅而後行待恃習而後定喜怒哀悲之氣性也及其現於外則物取之也性自命出命自天降道始於情情生於性始者近情終者近義知情者能出之知義者能納之好惡性也所好所惡物也善不善性也所善所不善藝勢也凡性為主物取之也金石之有聲也弗扣不鳴人雖有性心弗取不出凡心有志也亡舉與不可人之不可獨行猶口之不可獨言也牛生而長雁生而伸其性使然人而學或使之也凡物亡不異也者剛之柱樹也剛取之也柔之約柔取之也四海之內其性一也其用心各異教使然也凡性或動之或逆之或節之或礪之或出之或養之或長之凡動性者物也逆性者悅也節性者故也礪性者義也出性者藝勢也養性者習也長性者道也凡現者之謂物快於己者之謂悅物之藝勢者之謂勢有為也者之謂故義也者群善之蕝也習也者有以習其性也道也者群物之道凡道心術為主道四術也唯人道為可道也其三術者道之而已詩書禮樂其始出皆生於人詩有為為哦之也書有為言之也禮樂有為舉之也聖人比其類而論會之觀其先後而逆訓之體其義而節文之理其情而出入之然後復以教教所以生德于中者也禮作於情或興之也當事因方而制之其先後之序則義道也或有序為之節則文也致容貌所以文節也君子美其情貴其義善其節好其容樂其道悅其教是以敬焉拜所以為服也其禮文也幣帛所以為信與徵也其貽義道也笑喜之淺澤也樂喜之深澤也凡聲其出於情也信然後其入撥人之心也厚聞笑聲則鮮如也斯喜聞歌謠則陶如也斯奮聽琴瑟之聲則悸如也斯歎觀賚武則齋如也斯作觀韶夏則勉如也斯儉咏思而動心喟如也其居節也舊其反善復始也慎其出入也順殆司其德也鄭衛之樂則非其聲而從之也凡古樂龍隆心益樂隆指皆教其人者也賚武樂取韶夏樂情凡至樂必悲哭亦悲皆至其情也哀樂其性相近也是故其心不遠哭之動心也浸恆其烈戀戀如也戚然以終樂之動心也賡深鬱慆其烈則流如也以悲悠然以思凡憂思而後悲凡樂思而後欣凡思之用心為甚歎思之方也其聲變則心從之矣其心變則其聲亦然吟遊由哀也噪遊由樂也愁遊由聲也嚱遊由心也凡人情為可悅也苟以其情雖過不惡不以其情雖難不貴未言而信有美情者也未教而民恆性善者也未賞而民勸含福者也未刑而民畏有心畏者也賤而民貴之有德者也貧而民聚焉有道者也獨居而樂有內入禮者也惡之而不可非者達於義者也非之而不可惡者篤於仁者也行之而不過知道者也聞道反上上交者也聞道反下下交者也聞道反己修身者也上交近事君下交得衆近從政修身近至仁同方而交以道者也不同方而交以故者也同悅而交以德者也不同悅而交以猷者也門內之治欲其婉也門外之治欲其折制也凡身欲靜而毋愆用心欲直而毋尤慮欲淵而毋暴退欲肅慎而毋輕進欲遜而言欲直而毋流居處欲逸易而毋漫君子執志必有夫皇皇之心出言必有夫簡簡之信賓客之禮必有夫齊齊之容祭祀之禮必有夫齊齊之敬居喪必有夫戀戀之哀凡悅人勿吝也身必從之言及則明舉之而毋偽凡交毋烈必使有末凡於道路毋思毋獨言獨居則習父兄之所樂苟無大害少枉入之可也已則勿復言也凡憂患之事欲任樂事欲後凡學者求其心有偽也弗得之矣人之不能以偽也可知也不過十舉其心必在焉察其見者情安失哉恕義之方也義敬之方也敬物之節也篤仁之方也仁性之方也性或生之忠信之方也信情之方也情出於性愛類七唯性愛為近仁智類五唯義道為近忠惡類三唯惡不仁為近義所為道者四唯人道為可道也凡用心之躁者思為甚用智之疾者患為甚用情之至者哀樂為甚用身之辨便者悅為甚用力之盡者利為甚目之好色耳之樂聲鬱陶之氣也人不難為之死有其為人之節節如也不有夫簡簡之心則采有其為人之簡簡如也不有夫恆終殆始怡之志則縵人之巧言利詞者不有夫詘詘之心則流人之悅然可與和安者不有夫奮作之情則瞀侮有其為人之快如也弗養牧不可有其為人之淵原如也弗輔不足
